# Build settings
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
permalink: pretty

# Setting exclude replaces Jekyll's defaults, so Gemfile, Gemfile.lock and vendor are repeated here
exclude:
  - CLAUDE.md
  - README.md
  - Makefile
  - Gemfile
  - Gemfile.lock
  - vendor
